name: Verificación

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp verify

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        env:
          VERSION: 8.30.1
          SUMA: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SUMA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if ! git show "${BASE}:.gitleaks.toml" > "${RUNNER_TEMP}/gitleaks.toml" 2>/dev/null; then
            echo '[extend]' > "${RUNNER_TEMP}/gitleaks.toml"
            echo 'useDefault = true' >> "${RUNNER_TEMP}/gitleaks.toml"
          fi
          ./gitleaks git --config "${RUNNER_TEMP}/gitleaks.toml" --redact --no-banner --log-opts "${BASE}..HEAD" .
