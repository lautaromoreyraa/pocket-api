
spring:
  application:
    name: pocket-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: optional:file:./application-local.properties

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 600000
      keepalive-time: 300000

  lifecycle:
    timeout-per-shutdown-phase: 20s

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

pocket:

  hormiga:
    umbral-ocurrencias: 3
    excluir-cuotas: true
    excluir-fijos: true

  promedio:
    meses-minimos: 2
    ventana-meses: 12

  resumen:
    movimientos-maximos: 3

  cuotas:
    maximo: 60
    desfase-primera-cuota: 1

  periodo:
    zona-horaria: America/Argentina/Buenos_Aires

  moneda:
    codigo-base: ARS
    refresco-cotizacion-minutos: 30

  security:
    jwt:
      expiracion-dias: 365
      emisor: pocket-api

  ia:
    proveedor: ${IA_PROVEEDOR:gemini}
    modelo: gemini-3.6-flash
    url-base: https://generativelanguage.googleapis.com/v1beta
    timeout-segundos: 90
    conexion-timeout-segundos: 10
    intentos: 3
    backoff-inicial-ms: 1000
    espera-maxima-ms: 10000
    limite-diario-por-usuario: ${IA_LIMITE_DIARIO:0}
    limite-diario-global: ${IA_LIMITE_DIARIO_GLOBAL:0}

    groq:
      url-base: https://api.groq.com/openai/v1
      modelo-voz: whisper-large-v3
      modelo-texto: ${IA_MODELO_TEXTO:openai/gpt-oss-20b}
      api-key: ${GROQ_API_KEY:}

  web:
    origenes-permitidos: ${CORS_ORIGENES:}

  demo:
    sembrar: ${DEMO_SEMBRAR:false}
    meses-historia: 4

  cotizacion:
    url: https://dolarapi.com/v1/dolares/blue
    timeout-segundos: 10

logging:
  level:
    root: INFO
    com.pocket: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
