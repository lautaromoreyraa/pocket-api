
spring:

  datasource:
    url: jdbc:mysql://localhost:3306/pocket?useSSL=false&connectionTimeZone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:pocket}
    password: ${DB_PASSWORD:pocket}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
