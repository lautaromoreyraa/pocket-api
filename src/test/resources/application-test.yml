# =============================================================================
#  PERFIL TEST — base en memoria, sin Docker ni MySQL
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:pocket;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

pocket:
  security:
    jwt:
      secret: secreto-solo-para-tests-no-usar-en-ningun-otro-lado-1234567890
  ia:
    api-key: fake-key-para-tests
