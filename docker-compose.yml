# =============================================================================
#  POCKET — entorno local
#
#  Las variables salen del archivo .env de esta misma carpeta.
#  ${VAR:-default} usa el valor por defecto si la variable no existe; sólo se
#  usa para lo que es de una base descartable de desarrollo.
#
#  DÍA A DÍA (solo la base, la app corre con mvnw y tenés recarga en caliente):
#      docker compose up -d
#
#  TODO CONTENERIZADO (app + base, para probar la imagen o mostrar el proyecto):
#      docker compose --profile full up -d --build
#
#  Apagar:        docker compose down            (los datos se conservan)
#  Borrar datos:  docker compose down -v         (los datos se PIERDEN)
#  Verificar:     docker compose config
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  BASE DE DATOS
  #  Los datos viven en un volumen nombrado, así que sobreviven a down.
  # ---------------------------------------------------------------------------
  mysql:
    # La misma serie que la MySQL compartida de Railway, donde corre producción.
    image: mysql:${MYSQL_VERSION:-9}
    container_name: ${COMPOSE_PROJECT_NAME:-pocket}-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pocket}
      MYSQL_USER: ${DB_USER:-pocket}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pocket}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      # UTC en la base y en la app, como en Railway. La zona de Argentina es
      # regla de negocio (pocket.periodo.zona-horaria), no del servidor.
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      # Sólo desde esta máquina: Podman publica en todas las interfaces y la
      # base, con credenciales de desarrollo, quedaría a la vista de la red.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - pocket-mysql-data:/var/lib/mysql
    # Por TCP (127.0.0.1) y no por socket: durante la inicialización MySQL
    # levanta un servidor temporal sólo con socket, y un ping a "localhost" lo
    # da por sano antes de tiempo y Flyway se conecta a una base a medio armar.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  #  APLICACIÓN
  #  Bajo el perfil "full", así el flujo de desarrollo normal no la levanta.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-pocket}-api:latest
    container_name: ${COMPOSE_PROJECT_NAME:-pocket}-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      mysql:
        # No arranca hasta que la base responde al healthcheck.
        # Sin esto, Flyway falla al no encontrar la base todavía lista.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Dentro de la red de compose, el host es el nombre del servicio.
      # Sin TLS dentro de la red local; allowPublicKeyRetrieval lo exige
      # caching_sha2_password cuando la conexión va en claro.
      DATABASE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-pocket}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      DB_USER: ${DB_USER:-pocket}
      DB_PASSWORD: ${DB_PASSWORD:-pocket}
      # Los secretos van sin valor a propósito. Así Compose los toma del .env
      # si están, y si no están quedan SIN DEFINIR, no vacíos: Spring no puede
      # resolverlos y la app no arranca. `${VAR:-}` los pasaría como cadena
      # vacía, y `${VAR:?}` rompería también `docker compose up -d` de la base
      # sola, porque Compose interpola el archivo entero aunque el servicio
      # esté en un perfil apagado.
      JWT_SECRET:
      GEMINI_API_KEY:
      GROQ_API_KEY:
      IA_PROVEEDOR: ${IA_PROVEEDOR:-gemini}
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pocket-mysql-data:
    name: ${COMPOSE_PROJECT_NAME:-pocket}-mysql-data
