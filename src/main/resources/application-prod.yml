
spring:

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

server:
  error:
    include-message: never
    include-binding-errors: never

pocket:
  security:
    jwt:
      secret: ${JWT_SECRET}
  ia:
    api-key: ${GEMINI_API_KEY}
  turnstile:
    secreto: ${TURNSTILE_SECRETO}

logging:
  level:
    root: WARN
    com.pocket: INFO
